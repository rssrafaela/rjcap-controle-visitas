<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Site em Manutenção | RJCAP</title>

    <meta name="theme-color" content="#6900d8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(105, 0, 216, 0.45),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(255, 101, 0, 0.35),
                    transparent 35%
                ),
                #15131a;

            color: white;
        }

        .manutencao {
            width: min(850px, 100%);
            text-align: center;

            padding: 60px 40px;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(12px);
        }

        .icone {
            width: 85px;
            height: 85px;

            margin: 0 auto 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 42px;

            background: linear-gradient(
                135deg,
                #6900d8,
                #b21885,
                #ff6500
            );

            box-shadow: 0 15px 40px rgba(105, 0, 216, 0.4);
        }

        h1 {
            font-size: clamp(38px, 7vw, 70px);
            font-weight: 900;
            line-height: 1;

            letter-spacing: -2px;

            margin-bottom: 25px;

            text-transform: uppercase;
        }

        .melhorias {
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 700;

            color: #d5d2dc;

            margin-bottom: 38px;

            text-transform: uppercase;
        }

        .data {
            display: inline-block;

            padding: 20px 30px;

            border-radius: 15px;

            background: linear-gradient(
                120deg,
                #6900d8,
                #b21885,
                #ff6500
            );

            font-size: clamp(21px, 4vw, 32px);
            font-weight: 900;

            text-transform: uppercase;

            box-shadow: 0 15px 40px rgba(105, 0, 216, 0.3);
        }

        .aviso {
            margin-top: 30px;

            color: #aaa7b0;

            font-size: 14px;
            font-weight: 600;

            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .manutencao {
                padding: 45px 22px;
            }

            .icone {
                width: 70px;
                height: 70px;
                font-size: 34px;
            }

            h1 {
                letter-spacing: -1px;
            }

            .data {
                padding: 17px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="manutencao">

        <div class="icone">
            ⚠
        </div>

        <h1>
            SITE EM<br>
            MANUTENÇÃO
        </h1>

        <p class="melhorias">
            AJUSTANDO MELHORIAS
        </p>

        <div class="data">
            REGISTROS A PARTIR DE 01/09
        </div>

        <p class="aviso">
            AGRADECEMOS A COMPREENSÃO
        </p>

    </main>

</body>
</html>
